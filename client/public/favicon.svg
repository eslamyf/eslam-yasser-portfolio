<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Radial Background -->
    <radialGradient id="fav-bg" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1E2F52" />
      <stop offset="60%" stop-color="#14213D" />
      <stop offset="100%" stop-color="#0B1220" />
    </radialGradient>

    <!-- Coral Primary Gradients -->
    <linearGradient id="fav-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8375" />
      <stop offset="50%" stop-color="#FF6B5B" />
      <stop offset="100%" stop-color="#E64C3B" />
    </linearGradient>

    <!-- Cream Secondary Gradient -->
    <linearGradient id="fav-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4EDE0" />
      <stop offset="100%" stop-color="#D9CFC1" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F4EDE0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14213D" stop-opacity="0.8" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="28" fill="#FF6B5B" opacity="0.14" filter="url(#fav-glow)" />

  <g filter="url(#fav-glow)">
    <!-- Letter E -->
    <path d="M 46 28 H 27 C 23.5 28 21 30.5 21 34 V 66 C 21 69.5 23.5 72 27 72 H 46" stroke="url(#fav-primary)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 23 50 H 41" stroke="url(#fav-primary)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Letter Y -->
    <path d="M 54 28 L 66 48 L 78 28" stroke="url(#fav-secondary)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 66 48 V 72" stroke="url(#fav-secondary)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Dot -->
    <circle cx="78" cy="72" r="3.5" fill="#FF6B5B" />
  </g>
</svg>
